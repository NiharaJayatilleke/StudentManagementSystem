<div class="container">
    <h2>Subjects</h2>

    <div *ngIf="subjects.length > 0; else noSubjects">

    <div *ngIf="isLoading">Loading subjects...</div>

    <ul *ngIf="!isLoading && subjects.length > 0">
        <li *ngFor="let subject of subjects">
            <span>
                {{subject.subjectName}} ({{subject.subjectId}})
            </span>
            <div class="action-buttons">
                <button class="edit-btn" [routerLink]="['/subjects/edit', subject.id]">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="delete-btn" (click)="delete(subject.id)">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </li>
    </ul>

    <div *ngIf="!isLoading && subjects.length === 0">
        No subjects found.
    </div>

    <div class="pagination" *ngIf="totalPages > 1">

        <button class="page-btn" (click)="prevPage()" [disabled]="page === 1">

            <i class="fa-solid fa-chevron-left"></i>
            Previous

        </button>

        <span class="page-info">
            Page {{ page }} of {{ totalPages }}
        </span>

        <button class="page-btn" (click)="nextPage()" [disabled]="page === totalPages">

            Next
            <i class="fa-solid fa-chevron-right"></i>

        </button>

    </div>

    <!-- <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="prevPage()" [disabled]="page === 1">
      Previous
    </button>

    <span>Page {{ page }} of {{ totalPages }}</span>

    <button (click)="nextPage()" [disabled]="page === totalPages">
      Next
    </button>
  </div> -->
  </div>
</div>

<ng-template #noSubjects>
  <p class="empty-message">
    No subjects available.
  </p>
</ng-template>
