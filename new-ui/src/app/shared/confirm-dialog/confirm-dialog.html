<h2 mat-dialog-title class="dialog-title">
    <i class="fa-solid fa-triangle-exclamation"></i>
    Confirm Action
</h2>

<mat-dialog-content>

    <p>{{ data.message }}</p>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        class="cancel-btn"
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-flat-button
        class="confirm-btn"
        (click)="confirm()">

        Delete

    </button>

</mat-dialog-actions>
